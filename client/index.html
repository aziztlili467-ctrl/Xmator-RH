<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="description" content="Amicale RH — Gestion des congés, maladies, présences et pointages du personnel." />
    <meta name="theme-color" content="#37261A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XMATOR RH" />
    <link rel="manifest" href="/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Typographie Google Fonts chargée uniquement APRÈS window.load : elle ne peut ni bloquer
      // le rendu ni l'événement load (sur réseau sans accès Google, la requête reste en arrière-plan
      // et la page utilise la pile système — --font-sans/--font-display/--font-numeric ont des replis).
      (function () {
        var url =
          'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800' +
          '&family=Inter:wght@400;500;600;700;800;900' +
          '&family=JetBrains+Mono:wght@400;500;600;700;800' +
          '&display=swap';
        window.addEventListener('load', function injecter() {
          var el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = url;
          document.head.appendChild(el);
        });
      })();
    </script>
    <link rel="icon" type="image/png" href="/emoticon-Xmator.png?v=rh2026" />
    <link rel="apple-touch-icon" href="/icons/xmator-rh-apple-touch-icon.png" />
    <title>Amicale — Gestion des congés</title>
    <script>
      // Borne XMATOR EYE : bascule dès le parse vers le manifest dédié (/manifest-eye.webmanifest)
      // et la couleur de thème sombre. Sans cela le navigateur évaluerait l'installabilité avec le
      // manifest SaaS et créerait l'app « XMATOR RH » au lieu de « XmatorEye ».
      (function () {
        if (!location.pathname.startsWith('/borne')) return;
        var manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute('href', '/manifest-eye.webmanifest');
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute('content', '#1c1917');
      })();
      // Capte l'événement d'installation PWA dès que le navigateur l'émet (peut précéder le bundle JS)
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstall = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
